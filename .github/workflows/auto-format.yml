name: Auto-format C++

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  clang-format:
    name: Apply clang-format to changed C++ files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the PR branch with full history so we can diff against base
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

      - name: Detect changed C++ files
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          git diff --name-only "$BASE" "$HEAD" \
            | grep -E '\.(cpp|hpp)$' > /tmp/changed_cpp_files.txt || true
          if [ -s /tmp/changed_cpp_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Found changed C++ files:"
            cat /tmp/changed_cpp_files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No C++ files changed."
          fi

      - name: Run clang-format on changed files
        if: steps.changed.outputs.has_files == 'true'
        run: |
          xargs -a /tmp/changed_cpp_files.txt clang-format -i

      - name: Commit and push formatting fixes
        if: steps.changed.outputs.has_files == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            xargs -a /tmp/changed_cpp_files.txt git add --
            git commit -m "style: apply clang-format to PR changes [skip ci]"
            git push
          else
            echo "No formatting changes needed."
          fi
