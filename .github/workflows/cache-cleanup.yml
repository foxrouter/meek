name: Cache cleanup

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete caches unused for 3+ days
    runs-on: ubuntu-24.04
    steps:
      - name: Delete stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)

          # Pass 1: collect all stale cache IDs before mutating the collection
          stale_ids=()
          page=1
          while true; do
            response=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPO}/actions/caches?per_page=100&page=${page}")
            page_ids=$(echo "$response" | \
              jq -r --arg cutoff "$cutoff" \
              '.actions_caches[] | select(.last_accessed_at <= $cutoff) | .id')
            while IFS= read -r id; do
              [ -n "$id" ] && stale_ids+=("$id")
            done <<< "$page_ids"
            fetched=$(echo "$response" | jq '.actions_caches | length')
            [ "$fetched" -lt 100 ] && break
            page=$((page + 1))
          done

          # Pass 2: delete all collected stale caches
          for id in "${stale_ids[@]+"${stale_ids[@]}"}"; do
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPO}/actions/caches/${id}"
          done
