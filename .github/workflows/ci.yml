name: CI

on:
  push:
    branches: ["main", "master", "copilot/**"]
    paths:
      - "src/**"
      - "include/**"
      - "tools/**"
      - "tests/**"
      - "ops/**"
      - "scripts/**"
      - "systemd/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - "install.sh"
      - "requirements.txt"
      - ".clang-format"
      - ".pre-commit-config.yaml"
      - "benchmarks/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "include/**"
      - "tools/**"
      - "tests/**"
      - "ops/**"
      - "scripts/**"
      - "systemd/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - "install.sh"
      - "requirements.txt"
      - ".clang-format"
      - ".pre-commit-config.yaml"
      - "benchmarks/**"
      - ".github/workflows/**"

# Default to read-only permissions for all jobs; individual jobs may widen
# specific permissions as needed (e.g. docker job needs packages: write).
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Python lint and tests
  # ─────────────────────────────────────────────────────────────────────────
  python-tests:
    name: Python lint + tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip && pip install -r requirements.txt
          python3 -c "import scipy; print('scipy', scipy.__version__)"

      - name: Lint with pycodestyle (new files only)
        run: |
          pip install pycodestyle
          # Enforce style on newly added files; pre-existing files are excluded
          # to avoid blocking CI on unrelated pre-existing violations.
          pycodestyle --max-line-length=100 \
            tests/test_iq_metrics.py \
            tests/test_db_wal.py \
            tests/test_classifier_correctness.py \
            tests/test_band_profiles.py \
            tests/test_demod_timing.py \
            tests/test_rf_audit.py \
            tests/crc_helpers.py \
            benchmarks/bench_iq_metrics.py

      - name: test_autotune
        run: python3 tests/test_autotune.py -v

      - name: test_decode_candidates
        run: python3 tests/test_decode_candidates.py -v

      - name: test_guardrails
        run: python3 tests/test_guardrails.py -v

      - name: test_classifier_correctness
        run: python3 tests/test_classifier_correctness.py -v

      - name: test_band_profiles
        run: python3 tests/test_band_profiles.py -v

      - name: test_db_wal
        run: python3 tests/test_db_wal.py -v

      - name: test_demod_ber
        run: python3 tests/test_demod_ber.py -v

      - name: test_demod_timing
        run: python3 tests/test_demod_timing.py -v

      - name: test_rf_audit
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_HARDWARE_TARGETS=OFF
          cmake --build build -t rf_audit
          python3 tests/test_rf_audit.py -v

      - name: test_snr_sweep
        run: python3 tests/test_snr_sweep.py -v

      - name: bench_throughput (acceptance gate)
        run: python3 tests/bench_throughput.py -v

      - name: test_setup.sh
        run: bash tests/test_setup.sh -v

      - name: test_install.sh
        run: bash tests/test_install.sh -v

      - name: test_canary.sh
        run: bash tests/test_canary.sh -v

      - name: test_check_ssh_permissions.sh
        run: bash tests/test_check_ssh_permissions.sh -v

      - name: test_deploy.sh
        run: bash tests/test_deploy.sh -v

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build iq_metrics (C++, no hardware deps) + validate vs Python
  # ─────────────────────────────────────────────────────────────────────────
  cpp-iq-metrics:
    name: C++ iq_metrics (build + test + sanitizer)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang-18 clang-format-18 clang-tidy-18 \
            pkg-config libsqlite3-dev libsoapysdr-dev
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18   /usr/local/bin/clang-tidy

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure (Release, no hardware targets)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_HARDWARE_TARGETS=OFF

      - name: Build iq_metrics and rf_audit
        run: cmake --build build -t iq_metrics rf_audit

      - name: clang-format check
        run: |
          clang-format --style=file -n --Werror \
            src/main.cpp src/rf_audit.cpp tools/iq_metrics.cpp || {
            echo "clang-format violations found. Run: clang-format -i src/main.cpp src/rf_audit.cpp tools/iq_metrics.cpp"
            exit 1
          }

      - name: clang-tidy static analysis
        run: |
          TIDY_CHECKS="-*,clang-analyzer-*,bugprone-*,modernize-*,performance-*,readability-*"
          COMMON_INCLUDES="-I include -I build/_deps/nlohmann_json-src/include"
          TIDY_FAIL=0

          # tools/iq_metrics.cpp (C++20, no hardware deps)
          clang-tidy-18 tools/iq_metrics.cpp \
            --checks="$TIDY_CHECKS" \
            -- -std=c++20 $COMMON_INCLUDES \
            2>&1 | tee /tmp/clang-tidy-iq_metrics.log || true
          grep -qE "error:" /tmp/clang-tidy-iq_metrics.log && TIDY_FAIL=1 || true

          # src/rf_audit.cpp (C++20, no hardware deps)
          clang-tidy-18 src/rf_audit.cpp \
            --checks="$TIDY_CHECKS" \
            -- -std=c++20 $COMMON_INCLUDES \
            2>&1 | tee /tmp/clang-tidy-rf_audit.log || true
          grep -qE "error:" /tmp/clang-tidy-rf_audit.log && TIDY_FAIL=1 || true

          # src/main.cpp (C++20, SoapySDR hardware abstraction)
          clang-tidy-18 src/main.cpp \
            --checks="$TIDY_CHECKS" \
            -- -std=c++20 $COMMON_INCLUDES -DHAVE_SOAPY \
            2>&1 | tee /tmp/clang-tidy-main.log || true
          grep -qE "error:" /tmp/clang-tidy-main.log && TIDY_FAIL=1 || true

          exit $TIDY_FAIL

      - name: Validate C++ output vs Python reference
        run: python3 tests/test_iq_metrics.py build/iq_metrics -v

      - name: Run benchmark (informational — not a hard gate)
        run: |
          python3 benchmarks/bench_iq_metrics.py build/iq_metrics \
            --repetitions 10 \
            --block-sizes 4096,65536 \
            --out benchmarks/results/bench_iq_metrics_ci.json

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Sanitizer build (ASAN + UBSAN on iq_metrics)
  # ─────────────────────────────────────────────────────────────────────────
  sanitizer:
    name: C++ sanitizer build (ASAN + UBSAN)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # ASAN leak detection can produce false positives in subprocess; disable
      # for this job which runs iq_metrics via Python subprocess.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang-18 pkg-config libsqlite3-dev
          sudo update-alternatives --install /usr/bin/cc  cc  /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-18 100

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure (Debug, sanitizers, no hardware targets)
        run: |
          cmake -S . -B build-san \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DBUILD_HARDWARE_TARGETS=OFF \
            -DENABLE_SANITIZERS=ON

      - name: Build iq_metrics with sanitizers
        run: cmake --build build-san -t iq_metrics

      - name: Run validation tests under ASAN+UBSAN
        run: python3 tests/test_iq_metrics.py build-san/iq_metrics -v

  # ─────────────────────────────────────────────────────────────────────────
  # 4. HAVE_LIQUID build — compile rf_adapt_intel with liquid-dsp enabled
  #    and run the demod BER/CRC-32 Python integration test.
  # ─────────────────────────────────────────────────────────────────────────
  changes-liquid:
    name: Detect liquid-relevant changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      liquid: ${{ steps.filter.outputs.liquid }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            liquid:
              - 'src/**'
              - 'include/**'
              - 'CMakeLists.txt'
              - 'tests/test_demod_ber.py'

  cpp-liquid:
    name: C++ liquid-dsp build (HAVE_LIQUID)
    runs-on: ubuntu-24.04
    needs: changes-liquid
    permissions:
      contents: read
    if: |
      needs.changes-liquid.outputs.liquid == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang-18 \
            pkg-config libsqlite3-dev libsoapysdr-dev \
            git autoconf automake libtool jq

      - name: Cache liquid-dsp build
        id: cache-liquid
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/libliquid*
            ~/.local/include/liquid
            ~/.local/lib/pkgconfig/liquid.pc
          key: liquid-dsp-v1.6.0-${{ runner.os }}-clang18

      - name: Build and install liquid-dsp from source
        if: steps.cache-liquid.outputs.cache-hit != 'true'
        run: |
          # Build from source so that a pkg-config module (liquid.pc) is
          # always available on ubuntu-24.04 regardless of apt package state.
          # Pin to a specific release tag for reproducibility and supply-chain safety.
          # Install to $HOME/.local (user-writable) so the cache action can
          # restore this directory without requiring sudo.
          git clone --depth 1 --branch v1.6.0 https://github.com/jgaeddert/liquid-dsp.git
          cd liquid-dsp
          ./bootstrap.sh
          ./configure --prefix="$HOME/.local" --enable-optimizations
          make -j"$(nproc)"
          make install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure (Release, liquid-dsp enabled)
        run: |
          cmake -S . -B build-liquid \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$HOME/.local" \
            -DBUILD_HARDWARE_TARGETS=ON
        env:
          # Ensure pkg_check_modules finds liquid.pc installed under the user
          # prefix ($HOME/.local) by both the source build and the cache restore.
          PKG_CONFIG_PATH: ${{ env.HOME }}/.local/lib/pkgconfig

      - name: Build rf_adapt_intel (HAVE_LIQUID smoke-test)
        run: cmake --build build-liquid -t rf_adapt_intel

      - name: Verify HAVE_LIQUID was active in the build
        run: |
          if [ ! -f build-liquid/compile_commands.json ]; then
            echo "compile_commands.json not found; ensure CMAKE_EXPORT_COMPILE_COMMANDS is ON."
            exit 1
          fi

          # compile_commands.json entries may use either a "command" string or an
          # "arguments" array; search both forms so the check is generator-agnostic.
          if ! jq -e '
            any(.[];
              (.command? // "" | contains("-DHAVE_LIQUID")) or
              (.arguments? // [] | any(. == "-DHAVE_LIQUID"))
            )
          ' build-liquid/compile_commands.json > /dev/null; then
            echo "HAVE_LIQUID compile definition (-DHAVE_LIQUID) not present in compile_commands.json."
            echo "rf_adapt_intel was not built with liquid-dsp support enabled."
            exit 1
          fi

          echo "Verified: HAVE_LIQUID compile definition is present in the build flags."

      # test_demod_ber.py is a Python algorithm mirror test: it validates BER
      # and CRC-32 logic in pure Python.  The C++ demod_chains.hpp code is
      # compile-tested by the "Build rf_adapt_intel" step above; there is no
      # C++ runtime test here because the binary requires SDR hardware.
      - name: test_demod_ber (Python algorithm mirror tests)
        run: python3 tests/test_demod_ber.py -v

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Security: Python dependency vulnerability scan
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit --requirement requirements.txt \
            --output json \
            --output-file security-audit.json || \
          pip-audit --requirement requirements.txt

      - name: Upload security audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit
          path: security-audit.json

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Container image build (Docker)
  # ─────────────────────────────────────────────────────────────────────────
  changes-docker:
    name: Detect docker-relevant changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'install.sh'
              - 'ops/**'

  docker:
    name: Container image build
    runs-on: ubuntu-24.04
    needs: changes-docker
    permissions:
      contents: read
    if: |
      needs.changes-docker.outputs.docker == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (tests run inside Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rf-adapt-intel:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
