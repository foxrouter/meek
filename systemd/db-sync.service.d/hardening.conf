# Systemd security hardening drop-in for db-sync.service
# Deploy to: /etc/systemd/system/db-sync.service.d/hardening.conf

[Service]
# Filesystem protection
ProtectSystem=full
ProtectHome=yes
# Give the service its own private /tmp so mktemp creates files in an
# isolated namespace; no sensitive data bleeds out to the shared /tmp.
PrivateTmp=yes
# db-sync reads the DB from and writes backup temps (in PrivateTmp) into
# /var/lib/rf-adapt-intel; the live DB may need WAL sidecar writes during
# the sqlite3 online backup.
ReadWritePaths=/var/lib/rf-adapt-intel

# Privilege/capability reduction
NoNewPrivileges=yes
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_MODULE
AmbientCapabilities=

# Kernel hardening
ProtectClock=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes

# Memory hardening
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes

# Syscall filter: allow service-typical + file + network (rsync/ssh) operations
SystemCallFilter=@system-service @chown @file-system @network-io
SystemCallArchitectures=native
