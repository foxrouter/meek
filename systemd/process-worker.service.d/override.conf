# Environment and threshold overrides for process-worker.service
# Deploy to: /etc/systemd/system/process-worker.service.d/override.conf
# Tune these values per deployment (Brian vs Ray, band, canary vs production).
# Both Ray (Pi) and Brian (woger) must use identical values here unless a
# per-deployment drop-in intentionally overrides a specific key.

[Service]
# IMPORTANT — LOAD ORDER: Environment= lines in this drop-in are applied
# AFTER EnvironmentFile= entries in process-worker.service, which means any
# variable set here permanently overrides the same variable from
# /etc/rf_worker/thresholds.env or /etc/default/rf-adapt-intel.
# To make a change take effect, edit this file — not those EnvironmentFile
# sources — for any variable listed below.
# Variables not listed here are inherited from the EnvironmentFile= entries
# in process-worker.service.

# --- Classifier thresholds ---
Environment=RF_MIN_POWER=5e-6
# Align across all deployments — Pi was at 0.35; standardise on 0.6.
Environment=RF_CONF_THRESHOLD=0.6
Environment=RF_CONSOLE_CONF=0.8
# RF_SNAPSHOT_CONF: keep equal to RF_CONF_THRESHOLD so every DB write gets a
# snapshot.  If left unset the worker inherits conf_threshold automatically.
#Environment=RF_SNAPSHOT_CONF=0.6

# --- SNR / BW guardrails ---
# 3 dB floor validated on both Ray and Brian (38/38 tests passing).
# Eliminates spurious cw_like noise-floor hits seen at 0 dB.
# Use ops/canary.sh to override to 0 during passive / canary runs.
Environment=RF_SNR_MIN_DB=3.0
Environment=RF_EXPECTED_BW_HZ=0

# --- Paths ---
Environment=RF_DB_PATH=/var/lib/rf-adapt-intel/rf_adapt_intel.db
Environment=RF_SNAPSHOT_DIR=/var/lib/rf-adapt-intel/snapshots
Environment=RF_WORKER_LOG=/var/lib/rf-adapt-intel/worker.log
Environment=RF_METRICS_FILE=/var/lib/rf-adapt-intel/metrics.prom
Environment=RF_HEARTBEAT_FILE=/var/lib/rf-adapt-intel/heartbeat

# --- Snapshot retention ---
# RF_SNAPSHOT_RETENTION_DAYS: days to keep IQ snapshots (0 = keep forever).
# Pruning runs every 24 h from proc_loop. Set > 0 to prevent unbounded
# snapshot directory growth on long-running nodes.
Environment=RF_SNAPSHOT_RETENTION_DAYS=0
