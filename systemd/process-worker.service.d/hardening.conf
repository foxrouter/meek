# Systemd security hardening drop-in for process-worker.service
# Deploy to: /etc/systemd/system/process-worker.service.d/hardening.conf

[Service]
# Filesystem protection
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/rf-adapt-intel /var/log/rf-adapt-intel /etc/rf_worker

# Privilege/capability reduction
NoNewPrivileges=yes
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN
AmbientCapabilities=

# Kernel hardening
ProtectClock=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes

# Memory hardening
# REMOVED — breaks SoapySDR dlopen() on kernel ≥ 5.16 (Noble 6.8, Bookworm 6.1+):
# MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes

# Syscall filter: allow service-typical + file + chown operations only
SystemCallFilter=@system-service @chown @file-system
# Block dangerous syscall groups while leaving mprotect() available for dlopen.
# @obsolete covers old/unneeded syscalls; @privileged covers CAP_SYS_* paths;
# @raw-io prevents direct hardware access; @reboot/@swap/@clock cover
# admin-only operations irrelevant to this service.
SystemCallFilter=~@obsolete @privileged @raw-io @reboot @swap @clock
SystemCallArchitectures=native
