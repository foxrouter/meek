# Systemd security hardening drop-in for process-worker.service
# Deploy to: /etc/systemd/system/process-worker.service.d/hardening.conf

[Service]
# Filesystem protection
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/rf-adapt-intel /var/log/rf-adapt-intel /etc/rf_worker

# Privilege/capability reduction
NoNewPrivileges=yes
CapabilityBoundingSet=~CAP_SYS_ADMIN ~CAP_SYS_MODULE ~CAP_NET_ADMIN
AmbientCapabilities=CAP_SYS_NICE

# Kernel hardening
ProtectClock=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes

# Memory hardening
# REMOVED — breaks SoapySDR dlopen() on kernel ≥ 5.16 (Noble 6.8, Bookworm 6.1+):
# MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes

# Syscall allowlist: permit @system-service/@chown/@file-system syscalls only,
# with explicit subtractions (~@...) removing dangerous subsets that overlap
# those groups. mprotect() is intentionally not blocked here so that
# dlopen() can map SoapySDR plugin text segments (kernel ≥ 5.16 requirement).
# ~@obsolete: old/unneeded syscalls; ~@privileged: CAP_SYS_* paths;
# ~@raw-io: direct hardware access; ~@reboot/@swap/@clock: admin-only ops.
SystemCallFilter=@system-service @chown @file-system ~@obsolete ~@privileged ~@raw-io ~@reboot ~@swap ~@clock
SystemCallArchitectures=native
