# Thread / queue / resource tuning for process-worker.service
# Deploy to: /etc/systemd/system/process-worker.service.d/processor.conf

[Service]
# Bound the systemd stop timeout: the main loop polls g_shutdown every 2s, so
# threads receive request_stop() within ~2s of SIGTERM.  15s gives 7× headroom
# while avoiding the 90-second default that risks log/DB writes during a rapid
# redeploy or canary rollback.
TimeoutStopSec=15

# File descriptor limit (SDR USB device + DB + logs + snapshots)
LimitNOFILE=4096

# Maximum number of tasks (2 capture+processing threads + snapshot worker + OS overhead)
TasksMax=2048

# Block-length, analysis window, and read timeout
Environment=RF_BLOCK_LEN=4096
Environment=RF_ANALYSIS_LEN=4096
Environment=RF_READ_TIMEOUT_US=500000

# NOTE: Thresholds and snapshot paths (RF_MIN_POWER, RF_SNAPSHOT_CONF, RF_SNAPSHOT_DIR)
# are configured in override.conf to allow deployment-specific tuning.
