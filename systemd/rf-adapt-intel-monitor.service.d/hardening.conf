# Systemd security hardening drop-in for rf-adapt-intel-monitor.service
# Deploy to: /etc/systemd/system/rf-adapt-intel-monitor.service.d/hardening.conf
#
# The monitor runs as root (to call `systemctl reset-failed/start`) so full
# privilege stripping is not possible.  Apply the subset of hardening that
# does not require a non-root user while still reducing blast radius.

[Service]
# Filesystem protection: strict makes all paths read-only except those
# explicitly listed in ReadWritePaths.  The monitor only reads from
# /var/lib/rf-adapt-intel (DB, heartbeat, metrics); systemctl operations go
# via D-Bus (/run/systemd) which strict does not restrict.
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# Allow writes to the runtime data directory (e.g. future heal scripts that
# write status files; canary.sh currently only reads from this path).
ReadWritePaths=/var/lib/rf-adapt-intel

# Privilege reduction: even running as root we can prevent privilege
# escalation via suid/capability-raising.
NoNewPrivileges=yes
RestrictSUIDSGID=yes
LockPersonality=yes

# Kernel hardening
ProtectClock=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
