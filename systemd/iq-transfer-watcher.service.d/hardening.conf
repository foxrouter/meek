# Systemd security hardening drop-in for iq-transfer-watcher.service
# Deploy to: /etc/systemd/system/iq-transfer-watcher.service.d/hardening.conf

[Service]
# Filesystem protection
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
# transfer_iq.sh reads snapshots, writes to the transfer log
ReadWritePaths=/var/lib/rf-adapt-intel /var/log

# Privilege/capability reduction
NoNewPrivileges=yes
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_MODULE
AmbientCapabilities=

# Kernel hardening
ProtectClock=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes

# Memory hardening
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes

# Syscall filter: allow service-typical + file + network (rsync/ssh) operations
SystemCallFilter=@system-service @chown @file-system @network-io
SystemCallArchitectures=native
